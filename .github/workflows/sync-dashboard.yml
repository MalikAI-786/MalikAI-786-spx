# Manual recovery sync from the SPX research repo into the separate public dashboard repo.
#
# WHY MANUAL-ONLY (2026-08-21)
# The scheduled workflow was generating repeated failure notifications because the
# required DASHBOARD_DEPLOY_KEY secret is not configured. The dashboard itself is
# already published in MalikAI-786/index007.html. Repeated scheduled failures add
# no analytical value and obscure real model/control failures.
#
# This workflow is deliberately preserved rather than deleted. Once a write-enabled
# deploy key is configured for MalikAI-786/index007.html, run it manually from the
# Actions tab to copy public-safe dashboard data and reports.
#
# Source mapping:
#   dashboard/data/** -> target data/**
#   SPX-Reports/**    -> target reports/**
#
# Required secret for a manual run:
#   DASHBOARD_DEPLOY_KEY
#
# IMPORTANT: no scheduled or push trigger may be reintroduced until the secret is
# verified and one manual run succeeds end-to-end.

name: sync-dashboard

on:
  workflow_dispatch:

concurrency:
  group: sync-dashboard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout SPX repo
        uses: actions/checkout@v4
        with:
          path: spx
          fetch-depth: 1

      - name: Verify deploy key secret is present
        env:
          DEPLOY_KEY: ${{ secrets.DASHBOARD_DEPLOY_KEY }}
        run: |
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::DASHBOARD_DEPLOY_KEY is not configured. This workflow is manual-only until the dashboard deploy key is installed."
            exit 1
          fi

      - name: Configure SSH for dashboard repo
        env:
          DEPLOY_KEY: ${{ secrets.DASHBOARD_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'CFG'
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CFG

      - name: Clone dashboard repo
        run: git clone --depth 1 git@github.com:MalikAI-786/index007.html.git dashboard

      - name: Detect changes and copy public-safe files
        id: copy
        run: |
          mkdir -p dashboard/data
          changed=0

          if [ -d spx/dashboard/data ]; then
            while IFS= read -r -d '' src; do
              rel="${src#spx/dashboard/data/}"
              dst="dashboard/data/$rel"
              mkdir -p "$(dirname "$dst")"
              if [ ! -f "$dst" ] || ! cmp -s "$src" "$dst"; then
                cp "$src" "$dst"
                changed=1
              fi
            done < <(find spx/dashboard/data -type f -print0)
          fi

          if [ -d spx/SPX-Reports ]; then
            mkdir -p dashboard/reports
            while IFS= read -r -d '' src; do
              rel="${src#spx/SPX-Reports/}"
              dst="dashboard/reports/$rel"
              mkdir -p "$(dirname "$dst")"
              if [ ! -f "$dst" ] || ! cmp -s "$src" "$dst"; then
                cp "$src" "$dst"
                changed=1
              fi
            done < <(find spx/SPX-Reports -type f \( -name '*.md' -o -name '*.html' -o -name '*.json' \) -print0)
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit and push dashboard data
        if: steps.copy.outputs.changed == '1'
        working-directory: dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          ts="$(date -u +%Y-%m-%dT%H:%MZ)"
          git commit -m "chore(data): manual sync from SPX repo $ts"
          git push origin main

      - name: No changes
        if: steps.copy.outputs.changed != '1'
        run: echo "Dashboard is already current; no commit required."
